<style>
*{box-sizing:border-box;margin:0}
body{background:#0c0618;color:#fff;font-family:Nunito,Arial Black,sans-serif;font-weight:900;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
#wrap{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;border:4px solid #ffe01b;box-shadow:0 0 0 6px #ff3d7f;border-radius:14px;overflow:hidden;transition:transform .4s}
canvas{width:100%;height:100%;display:block}

#pb{pointer-events:auto;font:14px Bungee,Impact,sans-serif;background:#ffe01b;border:0;border-radius:8px;padding:2px 10px;cursor:pointer;margin-left:8px}

#bn.on{opacity:1;transform:translate(-50%,0)}
.scr{position:fixed;inset:0;background:rgba(12,6,24,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:9;text-align:center;padding:16px}
.hide{display:none!important}
.logo{font:clamp(56px,12vw,130px) Bungee,Impact,sans-serif;color:#ffe01b;text-shadow:6px 6px 0 #ff3d7f,-3px -3px 0 #00e5ff;animation:gl 1.2s steps(2) infinite;line-height:1}
@keyframes gl{50%{text-shadow:-6px 2px 0 #00e5ff,6px -2px 0 #ff3d7f}}
h2{font:clamp(28px,5vw,48px) Bungee,Impact,sans-serif;color:#00e5ff}
p{font-size:clamp(14px,2.2vw,20px);max-width:600px;line-height:1.4}
.big{font:clamp(18px,3vw,26px) Bungee,Impact,sans-serif;background:#ff3d7f;color:#fff;border:0;border-radius:16px;padding:12px 34px;box-shadow:0 6px 0 #a3134c;cursor:pointer;transition:transform .12s}
.big:hover{transform:scale(1.07) rotate(-1deg)}
.big:active{transform:translateY(4px)}
label{font-size:20px;display:flex;gap:10px;align-items:center}
#grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:min(94vw,700px)}
#grid button{font:16px Bungee,Impact,sans-serif;background:#00e5ff;color:#140b2e;border:0;border-radius:12px;padding:8px 2px;cursor:pointer}
#grid button:disabled{background:#333;color:#777}
#grid small{display:block;font:10px Nunito,Arial,sans-serif}
#joy{position:fixed;left:14px;bottom:14px;width:130px;height:130px;border-radius:50%;background:#fff2;border:3px solid #fff5;display:none;align-items:center;justify-content:center;z-index:5}
#knob{width:56px;height:56px;border-radius:50%;background:#ffe01b}
#btns{position:fixed;right:14px;bottom:14px;display:none;gap:12px;z-index:5}
.tb{font:14px Bungee,Impact,sans-serif;width:92px;height:92px;border-radius:50%;border:0;background:#00e5ff;color:#140b2e}
@media(pointer:coarse){#joy,#btns{display:flex}}
.flip{transform:rotate(180deg)}
.shake{animation:sh .3s linear}
#rot{position:fixed;inset:0;background:#0c0618;z-index:20;display:none;align-items:center;justify-content:center;font:clamp(18px,4vw,28px) Bungee,Impact,sans-serif;color:#ffe01b;text-align:center;padding:20px}
@media(orientation:portrait) and (pointer:coarse){body{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg)}#wrap{width:min(100vh,calc(100vw*16/9));height:min(100vw,calc(100vh*9/16))}}
@media(pointer:coarse){#wrap{border:0;box-shadow:none;border-radius:0}#hud{top:4px}}
@media(pointer:coarse) and (orientation:landscape){#joy{width:110px;height:110px;left:8px;bottom:8px;opacity:.8}#knob{width:44px;height:44px}.tb{width:70px;height:70px;font-size:12px}#btns{right:8px;bottom:8px;gap:8px}}
@keyframes sh{25%{transform:translate(-8px,4px)}75%{transform:translate(8px,-4px)}}
</style></head>

<div id="hud"><span id="hl"></span><span><span id="hn"></span> <span id="hs"></span><button id="pb">II</button></span></div>

<div class="scr" id="menu"><h1 class="logo">WHAT THE?!</h1><button class="big" data-go="play">PLAY</button><button class="big" data-go="levels">LEVELS</button><button class="big" data-go="settings">SETTINGS</button><button class="big" data-go="credits">CREDITS</button></div>

<script>
const $=i=>document.getElementById(i),cv=$('c'),c=cv.getContext('2d'),W=800,H=450,wrap=$('wrap');
let st='menu',cur=0,unlock=1,lives=3,score=0,deaths=0,LD=0,LT=0,best=Array(25).fill(0),A={},lv,P={x:40,y:378,w:26,h:32,vx:0,vy:0,gnd:false,sc:1},plat=[],goals=[],S={},tm=0,pitch=1,jx=0,pj=0,pe=0,AC,evc=6,K={};
const opt={sm:1,sf:1,ss:1};
const rnd=(a,b)=>a+Math.random()*(b-a),hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,R=(x,y,w,h,o)=>Object.assign({x,y,w,h,c:'#00e5ff'},o),D=(a,b)=>Math.hypot(a.x+a.w/2-b.x-b.w/2,a.y+a.h/2-b.y-b.h/2);
const em=(s,x,y,z)=>{c.font=z+'px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(s,x,y)};
const ac=()=>AC||(AC=new(window.AudioContext||window.webkitAudioContext)());
const tone=(f,d,t,v)=>{try{const a=ac(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}};
const sfx=(f,d=.1,t='square')=>opt.sf&&tone(f,d,t,.1);
const MN=[262,330,392,330,294,349,440,349];let mi=0,mus=0;
addEventListener('pointerdown',()=>{ac();if(!mus)mus=setInterval(()=>{opt.sm&&st!=='msg'&&tone(MN[mi++%8]*pitch,.18,'triangle',.04)},230)},{once:true});
const CL=['#ff3d7f','#ffe01b','#00e5ff','#7cff6b','#ff9f1c'],TX=['DISKON 99%!!!','KLIK SAYA','JANGAN TEKAN','KAMU KALAH','ANDA BERUNTUNG!','UPDATE SEKARANG?','SPAM 🍕','KAMU MENANG!!!','KLIK OK'];
const say=(t,ms=2200)=>{const b=$('bn');b.textContent=t;b.classList.add('on');clearTimeout(say.k);say.k=setTimeout(()=>b.classList.remove('on'),ms)};
const shk=()=>{if(opt.ss){wrap.classList.remove('shake');void wrap.offsetWidth;wrap.classList.add('shake')}};
const base=()=>{plat=[R(0,410,W,40,{c:'#ff3d7f'}),R(-20,-200,20,700,{c:'transparent'}),R(W,-200,20,700,{c:'transparent'})];Object.assign(P,{x:40,y:378,vx:0,vy:0,gnd:false,sc:1});goals=[];S={t:0,tot:0,i:0,jb:0}};
const phys=(dt,ax,g,j,sp=240,jv=620)=>{P.vx=ax*sp;if(j&&P.gnd){P.vy=-g*jv;P.gnd=false;sfx(520,.08)}P.x+=P.vx*dt;for(const p of plat)if(p.s!==0&&hit(P,p)){if(P.vx>0)P.x=p.x-P.w;else if(P.vx<0)P.x=p.x+p.w}P.vy+=g*1400*dt;P.y+=P.vy*dt;P.gnd=false;for(const p of plat)if(p.s!==0&&hit(P,p)){if(g*P.vy>=0){P.y=g>0?p.y-P.h:p.y+p.h;P.gnd=true}else P.y=g>0?p.y+p.h:p.y-P.h;P.vy=0}};
function openBox(i){const b=S.bx[i];b.o=1;if(i===S.key){S.hk=1;sfx(880,.2);return say('🔑 KUNCI DITEMUKAN!')}const r=Math.random();if(r<.2)return fail('BOOM! Kotaknya meledak. 💥');if(r<.4){P.sc=.5;setTimeout(()=>P.sc=1,4000);say('Kamu jadi kecil! (cuma kelihatannya)')}else if(r<.6){P.sc=1.6;setTimeout(()=>P.sc=1,4000);say('Kamu jadi raksasa! (cuma kelihatannya)')}else if(r<.8){S.jb=4;say('Lompat super! 🦘')}else{score+=150;say('+150 poin 🎉')}}
const LV=[
{n:'THE NORMAL LEVEL',h:'Level biasa. Sepertinya.',init(){base();plat.push(R(200,330,120,16),R(380,280,120,16),R(560,230,120,16));goals=[R(720,190,40,40)]},upd(dt,a,j){phys(dt,a,1,j);if(!S.sw&&P.x>400){S.sw=1;goals=[R(20,370,40,40)];say('TUJUAN PINDAH! Aturan berubah ✨',2800)}}},
{n:"DON'T MOVE",h:'Jangan bergerak. Serius. Jangan.',init(){base();goals=[R(740,370,40,40)];S.ph=0},upd(dt,a,j){if(!S.ph){phys(dt,0,1,0);if(a||j)return fail('Kamu bergerak! Dilarang!');if((S.t+=dt)>3){S.ph=1;S.t=0;say('GERAK KE KANAN!!! CEPAT!!!',2600)}}else{phys(dt,a,1,j);if((S.t+=dt)>6)fail('Terlalu lambat! Harusnya ke kanan.')}}},
{n:'THE GIANT BUTTON',h:'Tekan AKSI saat menyentuh tombol. Dia pindah terus.',init(){base();S.b=R(300,300,150,90,{c:'#ffe01b'});S.lim=0},upd(dt,a,j,e){phys(dt,a,1,j);S.lim+=dt;if(S.lim>30)return fail('Kelamaan! Tombolnya sudah kabur.');if((S.t+=dt)>.9){S.t=0;S.b.x=rnd(0,W-150);S.b.y=rnd(200,300)}if(e){if(hit(P,S.b))return win();S.b.x=rnd(0,W-150);S.b.y=rnd(200,300);say('Salah tombol! Dia kabur lagi.')}},draw(){c.fillStyle='#ffe01b';c.fillRect(S.b.x,S.b.y,150,90);c.fillStyle='#140b2e';c.font='24px Bungee,Impact,sans-serif';c.textAlign='center';c.fillText('TEKAN',S.b.x+75,S.b.y+52)}},
{n:'ESCAPE THE DUCK',h:'Lari! Bebek itu tidak suka kamu.',init(){base();plat.push(R(160,320,140,16),R(480,300,140,16));goals=[R(740,370,40,40)];S.d={x:-120,y:200}},upd(dt,a,j){phys(dt,a,1,j);const dx=P.x+13-S.d.x,dy=P.y+16-S.d.y,L=Math.hypot(dx,dy)||1;S.d.x+=dx/L*170*dt;S.d.y+=dy/L*170*dt;if(hit(P,{x:S.d.x-24,y:S.d.y-24,w:48,h:48}))fail('Dipatuk bebek! 🦆')},draw(){em('🦆',S.d.x,S.d.y,56)}},
{n:'UPSIDE DOWN',h:'Gravitasi dan kontrol berbalik tiap beberapa detik.',init(){base();plat.push(R(0,-20,W,20,{c:'#ff3d7f'}));goals=[R(740,370,40,40),R(740,20,40,40)];S.g=1;S.spk=[R(300,384,40,26),R(480,0,40,26)]},upd(dt,a,j){if((S.t+=dt)>4){S.t=0;S.g=-S.g;say(S.g<0?'TERBALIK!!! 🙃':'Normal lagi… mungkin.')}phys(dt,-a,S.g,j);if(S.spk.some(s=>hit(P,s)))fail('Tertusuk duri!')},draw(){c.fillStyle='#ff3d7f';for(const s of S.spk){c.beginPath();c.moveTo(s.x,s.y+s.h);c.lineTo(s.x+s.w/2,s.y);c.lineTo(s.x+s.w,s.y+s.h);c.fill()}}},
{n:'FAKE EXIT',h:'Itu pintu keluar. Pasti. Mungkin.',init(){base();plat.push(R(170,320,110,16),R(300,240,100,16),R(430,160,110,16));goals=[R(470,110,40,40)];S.fk=R(730,370,40,40);S.fl=plat[0];S.trap=0},upd(dt,a,j){phys(dt,a,1,j);if(!S.trap&&hit(P,S.fk)){S.trap=1;S.fl.s=0;say('PINTU KELUAR!!! 🚪',2600)}},draw(){em('🚪',S.fk.x+20,S.fk.y+20,40)}},
{n:'INVISIBLE PLATFORM',h:'Ada jalan, tapi tidak kelihatan. Cari.',init(){base();plat.push(R(150,320,110,16,{i:1}),R(290,240,110,16,{i:1}),R(430,160,110,16,{i:1}),R(580,100,180,16));goals=[R(690,50,40,40)]},upd(dt,a,j){phys(dt,a,1,j);for(const p of plat)if(p.i){p.rev=Math.max(0,(p.rev||0)-dt);if(P.gnd&&Math.abs(P.y+P.h-p.y)<3&&P.x+P.w>p.x&&P.x<p.x+p.w)p.rev=1.5}}},
{n:'THE SLOW RACE',h:'Balapan lambat. Kura-kura juga ikut.',init(){base();plat.push(R(260,300,120,16),R(520,300,120,16));goals=[R(730,370,40,40)];S.npc=40;S.rc=-1;S.rt=0},upd(dt,a,j){S.tot+=dt;if((S.t+=dt)>4){S.t=0;S.rc=Math.random()*3|0;S.rt=3;say(['DILARANG LOMPAT!','KONTROL TERBALIK!','KURA-KURA TIDUR!'][S.rc])}S.rt-=dt;const on=S.rt>0;phys(dt,on&&S.rc===1?-a:a,1,j&&!(on&&S.rc===0),130);if(!(on&&S.rc===2))S.npc+=(70+30*Math.sin(S.tot*1.3))*dt;if(S.npc>=720)fail('Kura-kura menang! 🐢')},draw(){em('🐢',S.npc,380,46)}},
{n:'INTERNET CHAOS',h:'Jangan percaya popup di layar.',init(){base();plat.push(R(180,330,120,16),R(340,270,120,16),R(500,210,120,16),R(660,150,120,16));goals=[R(690,100,40,40)];S.pt=0;S.pop=[]},upd(dt,a,j){phys(dt,a,1,j);if((S.pt-=dt)<=0){S.pt=1.5;S.pop=Array.from({length:5},()=>({x:rnd(-20,600),y:rnd(0,360),w:rnd(140,240),h:rnd(60,90),c:CL[Math.random()*5|0],s:TX[Math.random()*9|0]}))}},draw(){c.globalAlpha=.6;c.font='16px Bungee,Impact,sans-serif';c.textAlign='center';for(const p of S.pop){c.fillStyle=p.c;c.fillRect(p.x,p.y,p.w,p.h);c.fillStyle='#140b2e';c.fillText(p.s,p.x+p.w/2,p.y+p.h/2+6)}c.globalAlpha=1}},
{n:"DON'T TRUST THE GAME",h:'Game ini sering bohong. Ikuti dengan bijak.',init(){base();plat.push(R(160,330,120,16),R(340,250,120,16),R(520,330,120,16),R(660,240,120,16));goals=[R(700,190,40,40)];S.m=[[0,'Tekan AKSI untuk menang!'],[3,'Jangan lompat. Berbahaya!'],[7,'Level ini sudah selesai. Tutup saja.'],[11,'Bendera ada di sebelah kiri. Percaya saja.']]},upd(dt,a,j,e){phys(dt,a,1,j);S.t+=dt;if(S.i<4&&S.t>=S.m[S.i][0]){say(S.m[S.i][1],2800);S.i++}if(e)say('Hehe. Bohong. Itu tidak menang.')}},
{n:'GIANT FOOD',h:'Makanan raksasa mengejarmu. Lompat!',init(){base();plat.push(R(180,330,140,16),R(420,330,140,16));goals=[R(740,370,40,40)];S.fd=[{x:850,s:'🍩',v:150,w:60,h:50},{x:1100,s:'🍔',v:190,w:70,h:60},{x:1400,s:'🍕',v:170,w:60,h:50}]},upd(dt,a,j){phys(dt,a,1,j);for(const f of S.fd){f.x-=f.v*dt;if(f.x<-100)f.x=W+rnd(40,260);if(hit(P,{x:f.x,y:410-f.h,w:f.w,h:f.h})){fail('Dimakan makanan raksasa! 🍔');return}}},draw(){for(const f of S.fd)em(f.s,f.x+f.w/2,410-f.h/2,f.h*1.5)}},
{n:'THE REVERSE CONTROL',h:'Kontrolmu bisa berbalik kapan saja.',init(){base();plat.push(R(170,330,110,16),R(330,270,110,16),R(490,330,110,16),R(650,270,110,16));goals=[R(700,220,40,40)];S.rv=0;S.nx=1.5},upd(dt,a,j){if((S.t+=dt)>S.nx){S.t=0;S.nx=1.2+Math.random()*1.3;S.rv=!S.rv;say(S.rv?'KONTROL BERBALIK!':'Kembali normal… mungkin.')}phys(dt,S.rv?-a:a,1,j)}},
{n:'THE MYSTERY BOX',h:'Buka kotak. Salah satu isinya kunci. Mungkin.',init(){base();plat.push(R(220,330,120,16));S.bx=[120,320,520,650].map(x=>({x,y:370,w:44,h:40,o:0}));S.key=Math.random()*4|0;S.hk=0;S.door=R(740,350,44,60);S.w=0},upd(dt,a,j,e){S.jb-=dt;phys(dt,a,1,j,240,S.jb>0?800:620);if(e){const i=S.bx.findIndex(b=>!b.o&&hit(P,b));if(i>=0)openBox(i)}if(hit(P,S.door)){if(S.hk)return win();if(!S.w){S.w=1;say('Terkunci 🔒 Cari kuncinya!')}}},draw(){for(const b of S.bx){c.fillStyle=b.o?'#555':'#ffe01b';c.fillRect(b.x,b.y,b.w,b.h);em(b.o?'📭':'🎁',b.x+22,b.y+20,28)}em(S.hk?'🚪':'🔒',S.door.x+22,S.door.y+30,40)}},
{n:'BOSS OF NONSENSE',h:'Dekati bos dan tekan AKSI. Lima tamparan.',init(){base();plat.push(R(120,330,120,16),R(260,260,100,16));S.hp=5;S.b=R(600,150,120,120);S.pr=[];S.pt=0;S.dz=0},upd(dt,a,j,e){phys(dt,a,1,j);S.tot+=dt;S.b.y=170+90*Math.sin(S.tot*1.2);S.dz-=dt;if((S.pt-=dt)<=0){S.pt=1.2;S.pr.push({x:S.b.x,y:rnd(250,400),w:34,h:26,v:-260})}S.pr=S.pr.filter(p=>(p.x+=p.v*dt)>-60);if(S.pr.some(p=>hit(P,p))){fail('Kena lemparan kertas! 📄');return}if(e&&S.dz<=0){if(D(P,S.b)<130){S.hp--;S.dz=.4;sfx(300,.15,'sawtooth');say(['AH!','BUK!','ARGH!','DUAR!'][S.hp%4]);if(S.hp<=0)return win()}else say('Terlalu jauh! Mendekatlah.')}},draw(){em('👾',S.b.x+60+(S.dz>0?rnd(-6,6):0),S.b.y+60,120);for(const p of S.pr)em('📄',p.x+17,p.y+13,34);c.fillStyle='#ff3d7f';c.fillRect(S.b.x,S.b.y-18,S.hp*24,10)}},
{n:'THE MIX',h:'Semua mekanisme jadi satu. Hampir selesai.',init(){base();plat.push(R(0,-20,W,20,{c:'#ff3d7f'}),R(130,330,110,16),R(290,270,110,16),R(450,210,110,16),R(610,150,110,16));goals=[R(660,100,40,40)];S.g=1;S.gt=0;S.rt=0;S.rv=0;S.fd=[{x:860,s:'🍩',v:170,w:60,h:50},{x:1200,s:'🍔',v:210,w:70,h:60}]},upd(dt,a,j){if((S.gt+=dt)>6){S.gt=0;S.g=-S.g;say(S.g<0?'NORMAL?! TIDAK! 🙃':'Turun lagi! ⬇')}if((S.rt+=dt)>2.5){S.rt=0;S.rv=!S.rv}phys(dt,S.rv?-a:a,S.g,j);for(const f of S.fd){f.x-=f.v*dt;if(f.x<-100)f.x=W+rnd(40,300);if(hit(P,{x:f.x,y:410-f.h,w:f.w,h:f.h})){fail('Makanan raksasa, lagi! 🍩');return}}},draw(){for(const f of S.fd)em(f.s,f.x+f.w/2,410-f.h/2,f.h*1.5)}},
